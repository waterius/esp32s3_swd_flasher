  <rect class="box" x="620" y="10" width="150" height="300" rx="10" fill-opacity="0"/>
  <text class="h" x="695" y="330" text-anchor="middle">Jaffa Flasher</text>
  <text class="s" x="695" y="348" text-anchor="middle">ESP32-S3 Super Mini</text>
  <text class="s" x="520" y="24" text-anchor="middle">резисторы 100–330 Ом</text>
  <text class="s" x="458" y="132">если у платы нет питания</text>
</svg>
