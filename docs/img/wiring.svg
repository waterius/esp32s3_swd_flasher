<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" role="img" aria-labelledby="t">
  <title id="t">Подключение Jaffa Flasher к отладочной плате PY32F002B</title>
  <style>
    text { font: 14px Roboto, Helvetica, Arial, sans-serif; fill: #232323; }
    .h { font-weight: 700; font-size: 15px; }
    .s { font-size: 12px; fill: #6b6b6b; }
    .silk { font: 700 12px ui-monospace, Menlo, Consolas, monospace; fill: #ffffff; }
    .chip { font-size: 12px; font-weight: 700; fill: #1655F5; }
    .w { stroke: #1655F5; stroke-width: 2.5; fill: none; }
    .g { stroke: #232323; stroke-width: 2.5; fill: none; }
    .p { stroke: #F53410; stroke-width: 2.5; fill: none; stroke-dasharray: 6 4; }
    .r { fill: #fff; stroke: #1655F5; stroke-width: 2; }
    .box { fill: #F3F6FE; stroke: #1655F5; stroke-width: 2; }
    .pcb { fill: #1d1d1d; }
    .hole, .hole1 { fill: #9a9a9a; stroke: #d8d8d8; stroke-width: 2; }
    .pad1 { fill: #9a9a9a; stroke: #d8d8d8; stroke-width: 2; }
    .hot { fill: #1655F5; stroke: #ffffff; stroke-width: 2; }
    .pin { fill: #2f8fe0; stroke: #1b5fa0; stroke-width: 1; }
  </style>
  <rect class="pcb" x="20" y="70" width="430" height="270" rx="14"/>
  <rect class="pad1" x="53" y="85" width="14" height="14"/><rect class="pad1" x="53" y="311" width="14" height="14"/><circle class="hole1" cx="60" cy="92" r="7"/><circle class="hot" cx="94" cy="92" r="7"/><circle class="hole" cx="128" cy="92" r="7"/><circle class="hole" cx="162" cy="92" r="7"/><circle class="hole" cx="196" cy="92" r="7"/><circle class="hole" cx="230" cy="92" r="7"/><circle class="hole" cx="264" cy="92" r="7"/><circle class="hole" cx="298" cy="92" r="7"/><circle class="hole" cx="332" cy="92" r="7"/><circle class="hole" cx="366" cy="92" r="7"/><circle class="hole" cx="400" cy="92" r="7"/><circle class="hole1" cx="60" cy="318" r="7"/><circle class="hole" cx="94" cy="318" r="7"/><circle class="hole" cx="128" cy="318" r="7"/><circle class="hole" cx="162" cy="318" r="7"/><circle class="hole" cx="196" cy="318" r="7"/><circle class="hole" cx="230" cy="318" r="7"/><circle class="hole" cx="264" cy="318" r="7"/><circle class="hole" cx="298" cy="318" r="7"/><circle class="hole" cx="332" cy="318" r="7"/><circle class="hole" cx="366" cy="318" r="7"/><circle class="hole" cx="400" cy="318" r="7"/>
  <rect x="8" y="172" width="64" height="66" rx="8" fill="#c9c9c9" stroke="#8a8a8a" stroke-width="2"/>
  <text class="silk" x="82" y="210">USB-C</text>
  <rect x="200" y="180" width="56" height="56" rx="4" fill="#2b2b2b" stroke="#555" stroke-width="2"/>
  <text class="silk" x="228" y="254" text-anchor="middle">PY32F002B</text>
  <text class="silk" x="404" y="122">J4</text>
  <text class="silk" x="56" y="120">J2</text>
  <text class="silk" x="56" y="300">J3</text>
  <text class="s" x="235" y="368" text-anchor="middle">отладочная плата Embedfire PY32F002BF15U6TR, вид сверху</text>

  <path class="w" d="M94 92 V40 H620"/>
  <text class="chip" x="104" y="34">PA6 · TX лога</text>
  <text class="s" x="230" y="34">J2, 2-й пин от GND</text>
  <rect class="r" x="560" y="34" width="34" height="12" rx="3"/>
  <text x="640" y="45">GPIO5</text>

