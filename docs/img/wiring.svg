<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" role="img" aria-labelledby="t">
  <title id="t">Подключение Jaffa Flasher к плате с МК PY32</title>
  <style>
    text { font: 14px Roboto, Helvetica, Arial, sans-serif; fill: #232323; }
    .h { font-weight: 700; font-size: 15px; }
    .s { font-size: 12px; fill: #6b6b6b; }
    .w { stroke: #1655F5; stroke-width: 2.5; fill: none; }
    .g { stroke: #232323; stroke-width: 2.5; fill: none; }
    .p { stroke: #F53410; stroke-width: 2.5; fill: none; stroke-dasharray: 6 4; }
    .r { fill: #fff; stroke: #1655F5; stroke-width: 2; }
    .box { fill: #F3F6FE; stroke: #1655F5; stroke-width: 2; }
    .board { fill: #F5F5F5; stroke: #232323; stroke-width: 2; }
  </style>
  <rect class="box" x="10" y="20" width="170" height="260" rx="10"/>
  <text class="h" x="95" y="46" text-anchor="middle">Jaffa Flasher</text>
  <text class="s" x="95" y="64" text-anchor="middle">ESP32-S3 Super Mini</text>
  <rect class="board" x="460" y="20" width="170" height="260" rx="10"/>
  <text class="h" x="545" y="46" text-anchor="middle">Плата с PY32</text>
  <text class="s" x="545" y="64" text-anchor="middle">питание 3,0–3,6 В</text>

  <g>
    <text x="30" y="99">GPIO1</text><text x="610" y="99" text-anchor="end">SWCLK</text>
    <path class="w" d="M180 94 H460"/><rect class="r" x="290" y="88" width="40" height="12" rx="3"/>
    <text x="30" y="135">GPIO2</text><text x="610" y="135" text-anchor="end">SWDIO</text>
    <path class="w" d="M180 130 H460"/><rect class="r" x="290" y="124" width="40" height="12" rx="3"/>
    <text x="30" y="171">GPIO4</text><text x="610" y="171" text-anchor="end">NRST</text>
    <path class="w" d="M180 166 H460"/><rect class="r" x="290" y="160" width="40" height="12" rx="3"/>
    <text x="30" y="207">GPIO5</text><text x="610" y="207" text-anchor="end">TX лога</text>
    <path class="w" d="M460 202 H180"/><rect class="r" x="290" y="196" width="40" height="12" rx="3"/>
    <text x="30" y="243">GND</text><text x="610" y="243" text-anchor="end">GND</text>
    <path class="g" d="M180 238 H460"/>
    <text x="30" y="271">3V3</text><text x="610" y="271" text-anchor="end">3V3</text>
    <path class="p" d="M180 266 H460"/>
  </g>
  <text class="s" x="310" y="82" text-anchor="middle">резисторы 100–330 Ом</text>
  <text class="s" x="320" y="300" text-anchor="middle">3V3 — только если у платы нет своего питания</text>
</svg>
