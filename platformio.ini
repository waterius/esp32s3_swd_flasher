; Оснастка: ESP32-S3 Super Mini пишет чип по SWD, отвечает gdb как Black Magic Probe.
; Решения — openspec/changes/swd-flash-py32f002b/design.md (§1 — платформа и USB).

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
; у esp32-s3-devkitc-1 по умолчанию 8 МБ, у Super Mini — 4 МБ
board_upload.flash_size = 4MB
board_build.partitions = default.csv
; плата задаёт USB Serial/JTAG (ARDUINO_USB_MODE=1) — снимаем, ниже TinyUSB
build_unflags = -DARDUINO_USB_MODE=1
build_flags =
    ; USB CDC через TinyUSB: ему виден DTR — открыт ли порт на ПК (design §1)
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; логи ядра не должны попадать в порт: по нему идёт протокол gdb
    -DCORE_DEBUG_LEVEL=0
    -Wall
build_src_filter = +<*>
test_ignore = *
monitor_speed = 115200

; Чистый код на ПК: pio test -e native
[env:native]
platform = native
build_flags = -std=gnu++17 -Wall -Wextra -Isrc
build_src_filter = +<core/> +<chips/*_desc.cpp> +<chips/chips.cpp>
test_build_src = yes
